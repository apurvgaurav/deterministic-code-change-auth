<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="680" height="290">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
    <path d="M2 1.5L8.5 5L2 8.5" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect width="680" height="290" fill="transparent"/>

<!-- Inputs column: x=30-190 -->
<!-- Delta: candidate change -->
<rect x="30" y="50" width="160" height="46" rx="4" fill="rgba(30,41,59,0.88)" stroke="#7C7DD9" stroke-width="1.2"/>
<text x="110" y="68" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">&#916; — Candidate change</text>
<text x="110" y="84" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#C7D2FE">code diff + context</text>

<!-- C: Execution context -->
<rect x="30" y="122" width="160" height="46" rx="4" fill="rgba(30,41,59,0.88)" stroke="#7C7DD9" stroke-width="1.2"/>
<text x="110" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">C — Execution context</text>
<text x="110" y="156" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#C7D2FE">state, inputs, env.</text>

<!-- R: Reference behavior -->
<rect x="30" y="194" width="160" height="46" rx="4" fill="rgba(30,41,59,0.88)" stroke="#7C7DD9" stroke-width="1.2"/>
<text x="110" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">R — Reference behavior</text>
<text x="110" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#C7D2FE">prior execution trace</text>

<!-- Input arrows converging to pipeline -->
<line x1="190" y1="73" x2="250" y2="145" stroke="#9999CC" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="190" y1="145" x2="250" y2="145" stroke="#9999CC" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="190" y1="217" x2="250" y2="145" stroke="#9999CC" stroke-width="1.3" marker-end="url(#a)"/>

<!-- Pipeline box f() -->
<rect x="252" y="96" width="176" height="98" rx="6" fill="rgba(6,78,59,0.78)" stroke="#1D9E75" stroke-width="1.5"/>
<text x="340" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#ECFDF5">Authorization</text>
<text x="340" y="146" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#ECFDF5">pipeline</text>
<text x="340" y="172" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#A7F3D0" font-style="italic">f(&#916;, C, R)</text>

<!-- Output arrows from pipeline -->
<line x1="428" y1="125" x2="488" y2="98" stroke="#888" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="428" y1="165" x2="488" y2="192" stroke="#888" stroke-width="1.3" marker-end="url(#a)"/>

<!-- Output 1: ALLOW/BLOCK decision -->
<rect x="490" y="60" width="160" height="56" rx="4" fill="rgba(15,23,42,0.92)" stroke="#94A3B8" stroke-width="1"/>
<text x="570" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" font-weight="700" fill="#F8FAFC">Authorization decision</text>
<text x="536" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#059669">ALLOW</text>
<text x="556" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#94A3B8"> / </text>
<text x="578" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#DC2626">BLOCK</text>

<!-- Output 2: Replay trace T -->
<rect x="490" y="162" width="160" height="56" rx="4" fill="rgba(15,23,42,0.92)" stroke="#94A3B8" stroke-width="1"/>
<text x="570" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" font-weight="700" fill="#F8FAFC">T — Replay trace</text>
<text x="570" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#CBD5E1">full audit record</text>

<!-- Formal notation at bottom -->
<text x="340" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#CBD5E1" font-style="italic">f(&#916;, C, R) &#x2192; {ALLOW, BLOCK} &#x00D7; T</text>
<line x1="220" y1="262" x2="460" y2="262" stroke="#475569" stroke-width="0.8"/>
<text x="340" y="276" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" fill="#94A3B8">Decision is a pure function of inputs — no probabilistic threshold</text>

</svg>