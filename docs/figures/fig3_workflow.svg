<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="680" height="480">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
    <path d="M2 1.5L8.5 5L2 8.5" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- ── Stage 1: Issue mapping (two-line) ── -->
<rect x="170" y="20" width="340" height="54" rx="4" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
<text x="340" y="40" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">Issue mapping</text>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="10.5" fill="#94A3B8">maps candidate to predefined remediation path</text>
<line x1="340" y1="74" x2="340" y2="96" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#a)"/>

<!-- ── Stage 2: Candidate resolution ── -->
<rect x="170" y="98" width="340" height="54" rx="4" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
<text x="340" y="118" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">Candidate resolution</text>
<text x="340" y="136" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="10.5" fill="#94A3B8">fully specified before validation begins</text>
<line x1="340" y1="152" x2="340" y2="174" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#a)"/>

<!-- ── Stage 3: Replay execution (teal) ── -->
<rect x="170" y="176" width="340" height="54" rx="4" fill="#064E3B" stroke="#34D399" stroke-width="1.3"/>
<text x="340" y="196" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#D1FAE5">Replay execution</text>
<text x="340" y="214" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="10.5" fill="#A7F3D0">candidate run vs. reference run — same inputs</text>
<line x1="340" y1="230" x2="340" y2="252" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#a)"/>

<!-- ── Stage 4: Normalization (teal) ── -->
<rect x="170" y="254" width="340" height="54" rx="4" fill="#064E3B" stroke="#34D399" stroke-width="1.3"/>
<text x="340" y="274" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#D1FAE5">Normalization</text>
<text x="340" y="292" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="10.5" fill="#A7F3D0">authoritative signals retained — incidental variance excluded</text>
<line x1="340" y1="308" x2="340" y2="328" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#a)"/>

<!-- ── Diamond: center=(340,358), half-w=52, half-h=30 ── -->
<polygon points="340,328 392,358 340,388 288,358" fill="#334155" stroke="#64748B" stroke-width="1"/>
<text x="340" y="352" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">Behavioral</text>
<text x="340" y="366" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">equivalence?</text>

<!-- Branch lines from diamond bottom -->
<line x1="340" y1="388" x2="340" y2="406" stroke="#94A3B8" stroke-width="1.5"/>
<line x1="340" y1="406" x2="240" y2="406" stroke="#94A3B8" stroke-width="1.5"/>
<line x1="340" y1="406" x2="440" y2="406" stroke="#94A3B8" stroke-width="1.5"/>
<text x="280" y="402" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#94A3B8">Match</text>
<text x="400" y="402" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#94A3B8">Mismatch</text>
<line x1="240" y1="406" x2="240" y2="420" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="440" y1="406" x2="440" y2="420" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#a)"/>

<!-- ALLOW box -->
<rect x="160" y="420" width="160" height="42" rx="4" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
<text x="240" y="441" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#D1FAE5">ALLOW</text>

<!-- BLOCK box -->
<rect x="360" y="420" width="160" height="42" rx="4" fill="#7F1D1D" stroke="#F87171" stroke-width="1.5"/>
<text x="440" y="441" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#FEE2E2">BLOCK</text>

<!-- Side notes (trace) -->
<text x="570" y="435" text-anchor="start" font-family="Arial,sans-serif" font-size="10" fill="#64748B">+ replay trace</text>
<text x="570" y="449" text-anchor="start" font-family="Arial,sans-serif" font-size="10" fill="#64748B">retained</text>

</svg>
