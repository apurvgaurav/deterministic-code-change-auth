<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
    <path d="M2 1.5L8.5 5L2 8.5" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Title label -->
<text x="340" y="22" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#64748B" font-style="italic">Per-decision audit record — retained for independent verification</text>
<line x1="120" y1="30" x2="560" y2="30" stroke="#334155" stroke-width="0.8"/>

<!-- Stage 1: Candidate execution -->
<rect x="190" y="44" width="300" height="44" rx="4" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
<text x="340" y="64" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="12.5" font-weight="600" fill="#E2E8F0">Candidate execution</text>
<text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="10" fill="#94A3B8">inputs + context logged</text>
<line x1="340" y1="88" x2="340" y2="108" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#a)"/>

<!-- Stage 2: Reference comparison -->
<rect x="190" y="110" width="300" height="44" rx="4" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
<text x="340" y="130" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="12.5" font-weight="600" fill="#E2E8F0">Reference comparison</text>
<text x="340" y="144" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="10" fill="#94A3B8">normalized equivalence check recorded</text>
<line x1="340" y1="154" x2="340" y2="174" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#a)"/>

<!-- Stage 3: Authorization decision (teal highlight) -->
<rect x="190" y="176" width="300" height="44" rx="4" fill="#064E3B" stroke="#34D399" stroke-width="1.3"/>
<text x="340" y="196" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="12.5" font-weight="600" fill="#D1FAE5">Authorization decision</text>
<text x="340" y="210" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="10" fill="#A7F3D0">ALLOW or BLOCK — binary, no threshold</text>
<line x1="340" y1="220" x2="340" y2="240" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#a)"/>

<!-- Stage 4: Replay trace -->
<rect x="190" y="242" width="300" height="44" rx="4" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
<text x="340" y="262" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="12.5" font-weight="600" fill="#E2E8F0">Replay trace captured</text>
<text x="340" y="276" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="10" fill="#94A3B8">full execution sequence stored</text>
<line x1="340" y1="286" x2="340" y2="306" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#a)"/>

<!-- Stage 5: Ledger record (purple - permanent) -->
<rect x="190" y="308" width="300" height="44" rx="4" fill="#312E81" stroke="#818CF8" stroke-width="1.3"/>
<text x="340" y="328" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="12.5" font-weight="600" fill="#C7D2FE">Append-only ledger record</text>
<text x="340" y="342" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="10" fill="#A5B4FC">independently reproducible from logged inputs</text>

</svg>
